<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Maplibre Carto Demo</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://unpkg.com/maplibre-gl@^5.24.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@^5.24.0/dist/maplibre-gl.css" rel="stylesheet" />

<body>
    <header class="top-menu">
        <div class="left-section">
            <i class="fa fa-user" aria-hidden="true"></i>
            <p>Eligibilité</p>
            <i class="fa fa-caret-down" aria-hidden="true"></i>
        </div>
        <div>
            <div>
                <!-- Section dedié qux autres menus -->
            </div>
            <div>
                <!--Section dediée à la langue  -->
            </div>
            <input type="text" id="search-input" placeholder="Rechercher ..." />
        </div>
    </header>

    <main class="map-container">
        <div id="map"></div>

        <div class="add-polygon-btn" id="add-polygon">
            <i class="fa fa-plus" aria-hidden="true"></i>
        </div>
        <div class="main-section-search">
            <input type="text" id="search-input-2" placeholder="BUILDING_ID ou latitude, longitude" />
            <button class="search-button">Rechercher</button>
        </div>
    </main>



    <script src="app.js"></script>
